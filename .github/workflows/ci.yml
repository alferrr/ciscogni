name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest

    env:
      DB_HOST: localhost
      DB_USER: root
      DB_PASSWORD: ""
      DB_NAME: ciscogni
      DB_PORT: 3306
      JWT_SECRET: ci-test-secret
      BUILD_LOG_TOKEN: ci-test-token

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
